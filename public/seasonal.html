<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSH · Seasonal Dashboard</title>
<style>
:root{--ink:#14213d;--muted:#64748b;--line:#dbe3ef;--blue:#1463d9;--bg:#edf4fc}*{box-sizing:border-box}body{margin:0;font-family:"DM Sans","Segoe UI",Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#edf5ff,#f7faff 55%,#edf3fa)}.shell{width:100%;min-height:100vh;padding:20px}.hero{position:relative;overflow:hidden;padding:24px;border:1px solid #dbe7f5;border-radius:22px;background:radial-gradient(circle at 92% 85%,#0ea5e922,transparent 20rem),linear-gradient(135deg,#fff,#e8f2ff);box-shadow:0 16px 38px #1e569626}.hero:after{content:"";position:absolute;bottom:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#2563eb,#06b6d4,#10b981)}.hero-inner{position:relative;z-index:1}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:#1685a4}.hero h1{margin:8px 0 4px;font-size:clamp(25px,3vw,36px);letter-spacing:-.03em;color:#173b73}.subtitle{margin:0;color:#5b6f8c}.statusline{display:flex;align-items:center;gap:9px;margin-top:15px;color:#405775;font-size:13px;font-weight:600}.last-update-header{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;font-weight:700;color:#111827;line-height:1.3}.last-update-header .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55ea6;flex:0 0 auto}@media(max-width:680px){.last-update-header{font-size:11px;margin-top:7px;gap:6px}.last-update-header .dot{width:7px;height:7px}}.dot{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px #22c55e22}.dot.loading{background:#f59e0b}.dot.error{background:#ef4444}.filter-panel{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:18px;padding:16px 18px;border:1px solid #e1e8f2;border-radius:18px;background:#ffffffed;box-shadow:0 8px 22px #1e3a8a0d}.filter-copy{min-width:150px}.filter-label{display:block;margin-bottom:5px;color:#526985;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}.filter-help{color:#8291a5;font-size:12px}.filter-actions{display:flex;align-items:center;gap:10px;flex:1;justify-content:flex-end;min-width:min(100%,280px)}select,input{font:inherit}.category-select{width:min(100%,440px);min-height:46px;padding:0 42px 0 15px;border:1px solid #cbd8e8;border-radius:13px;background:#fff;color:#173b73;font-weight:700;box-shadow:inset 0 1px 2px #0f172a08;outline:none}.category-select:focus,.search:focus{border-color:#60a5fa;box-shadow:0 0 0 3px #bfdbfe88}.btn{min-height:44px;padding:0 17px;border:0;border-radius:12px;background:linear-gradient(135deg,#2563eb,#0ea5e9);color:white;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 6px 14px #2563eb24}.btn:disabled{opacity:.6;cursor:wait}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0}.stat{position:relative;overflow:hidden;padding:16px 18px;border:1px solid #dce6f2;border-radius:17px;background:#fff;box-shadow:0 8px 22px #1e3a8a0b}.stat:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#2563eb,#38bdf8)}.stat-label{color:#75869c;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.stat-value{margin-top:7px;color:#173b73;font-size:clamp(22px,3vw,29px);font-weight:800;font-variant-numeric:tabular-nums}.stat-note{margin-top:3px;color:#91a0b2;font-size:11px}.data-panel{overflow:hidden;border:1px solid #dbe4ef;border-radius:19px;background:#fff;box-shadow:0 12px 30px #0f2f5c12}.data-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:17px 19px;border-bottom:1px solid #edf1f6}.data-title{font-size:16px;font-weight:800;color:#173b73}.data-desc{margin-top:3px;color:#8291a5;font-size:12px}.table-tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.search{width:min(280px,65vw);min-height:40px;padding:0 12px;border:1px solid #dbe3ef;border-radius:11px;background:#f9fbfe;outline:none;font-size:13px}.table-wrap{display:block;width:100%;max-width:100%;max-height:65vh;overflow-x:auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x pan-y;scrollbar-width:thin}table{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0;font-size:13px;white-space:nowrap}th,td{padding:12px 14px;text-align:center;border-right:1px solid #eaf0f6;border-bottom:1px solid #eaf0f6;max-width:360px;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;background:linear-gradient(135deg,#173b73,#2563a8 60%,#0f766e);color:#fff;font-size:11px;letter-spacing:.045em;text-transform:uppercase}.group-header th{top:0;z-index:5;height:40px}.month-header th{top:40px;z-index:4;height:40px}th[data-sort-col]{cursor:pointer;user-select:none}th[data-sort-col]:hover{background:linear-gradient(135deg,#24518d,#3182ce 60%,#0f8b7e)}td{color:#34435d;background:#fff}tbody tr:nth-child(even) td{background:#f8fbff}tbody tr:hover td{background:#eef6ff}.prod-name-cell{text-align:left!important;white-space:normal;min-width:220px}.display-cell{min-width:170px;text-align:center!important;white-space:normal}.display-actions{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap}.display-actions .btn-mini{border:1px solid #d8e1ed;background:#fff;color:#34445c;border-radius:8px;padding:7px 9px;font-size:11px;font-weight:700;cursor:pointer}.display-actions .btn-mini.danger{background:#fff1f1;color:#b42318;border-color:#fee2e2}.display-actions .btn-mini:disabled{opacity:.55;cursor:wait}.display-thumb{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid #dbe3ef;cursor:pointer;display:block;margin:0 auto 6px}.rownum{position:sticky;left:0;z-index:1;background:#f1f5f9!important;color:#64748b;text-align:center;min-width:48px}th.rownum{z-index:3;background:#173b73!important}.state{padding:34px 18px;text-align:center;color:#64748b;line-height:1.6}.state.error{color:#b42318}.foot{padding:11px 18px;color:#8795a8;font-size:11px;border-top:1px solid #edf1f6;background:#fbfdff}
.btn-reset{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe;box-shadow:none}.photo-summary{grid-template-columns:repeat(3,minmax(0,1fr))}.photo-stat{font:inherit;text-align:left;cursor:pointer;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}.photo-stat:hover{transform:translateY(-2px);box-shadow:0 10px 24px #1e3a8a16}.photo-stat.active{border-color:#2563eb;box-shadow:0 0 0 2px #2563eb22,0 8px 22px #1e3a8a0b;background:#eff6ff}.photo-stat:focus-visible,.btn-reset:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}

</style></head><body><main class="shell">
<section class="hero"><div class="hero-inner"><h1>Seasonal Dashboard</h1><div class="statusline"><span class="dot loading" id="status-dot"></span><span id="status">Menghubungkan ke Google Spreadsheet...</span></div><div class="last-update-header" id="seasonal-last-update" aria-live="polite"><span class="dot"></span><span>Last Update : Memuat...</span></div></div></section>

<button class="stat photo-stat" id="filter-photo-done" type="button" aria-pressed="false"><div class="stat-label">Sudah Foto</div><div class="stat-value" id="stat-photo-done">0</div><div class="stat-note">Artikel dengan foto Display</div></button>
<button class="stat photo-stat" id="filter-photo-pending" type="button" aria-pressed="false"><div class="stat-label">Belum Foto</div><div class="stat-value" id="stat-photo-pending">0</div><div class="stat-note">Artikel belum memiliki foto</div></button>

</section>
<section class="data-panel"><div class="data-head"><div class="table-tools"><input id="search" class="search" type="search" placeholder="Cari dalam kategori..." disabled></div></div><div class="table-wrap" id="table-wrap"><div class="state">Mengambil data dari spreadsheet...</div></div><div class="foot" id="photo-status">Status foto Display: menghubungkan Google Drive...</div><div class="foot" id="footnote">Sumber: Google Spreadsheet · Tab Seasonal</div><input id="seasonalPhotoCamera" type="file" accept="image/*" capture="environment" style="display:none"><input id="seasonalPhotoGallery" type="file" accept="image/*" style="display:none"></section>
</main><script>
(function(){
'use strict';
const CSV_URL='https://docs.google.com/spreadsheets/d/13ZA7PhaSONe_4f437fBZVTmeNolJvislj_hTBycYTrY/gviz/tq?tqx=out:csv&gid=455253473';
const LAST_UPDATE_API='https://script.google.com/macros/s/AKfycbyRrr1nn23Spi2wz0qfT5uY1rg2ArswZ6mmJ_mE_tkvROSpU1h9F0gEfZABPdgk_iG0/exec';
const $=id=>document.getElementById(id);
const statusEl=$('status'),dot=$('status-dot'),categoryFilter=$('category-filter'),searchEl=$('search'),refreshBtn=$('refresh'),tableWrap=$('table-wrap');
let rows=[],headers=[],categoryIndex=-1,categoryValues=[],selectedCategory='',seasonalPhotos={},seasonalPhotoTarget='',seasonalPhotoBusy=false,photoFilter='',sortColumn=-1,sortDirection=1;
const fmt=new Intl.NumberFormat('id-ID');
function parseCSV(s){const out=[];let row=[],field='',quoted=false;for(let i=0;i<s.length;i++){const c=s[i],n=s[i+1];if(quoted){if(c==='"'&&n==='"'){field+='"';i++;}else if(c==='"')quoted=false;else field+=c;}else if(c==='"')quoted=true;else if(c===','){row.push(field);field='';}else if(c==='\n'){row.push(field.replace(/\r$/,''));out.push(row);row=[];field='';}else field+=c;}if(field.length||row.length){row.push(field.replace(/\r$/,''));out.push(row);}return out.filter(r=>r.some(v=>String(v).trim()!==''));}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setStatus(message,type){statusEl.textContent=message;dot.className='dot'+(type?' '+type:'');}
function formatSeasonalLastUpdate(value){if(!value)return '';const d=new Date(value);if(Number.isNaN(d.getTime()))return String(value);return d.toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:'Asia/Jakarta'})+' WIB';}
function showSeasonalLastUpdate(value){const el=$('seasonal-last-update');if(!el)return;const text=value?formatSeasonalLastUpdate(value):'Belum tersedia';el.innerHTML='<span class="dot"></span><span>Last Update : '+esc(text)+'</span>';}
window.seasonalLastUpdateCallback=function(data){showSeasonalLastUpdate(data&&data.success?data.lastUpdate:'');const script=$('seasonal-last-update-jsonp');if(script)script.remove();};
function loadSeasonalLastUpdate(){const old=$('seasonal-last-update-jsonp');if(old)old.remove();const script=document.createElement('script');script.id='seasonal-last-update-jsonp';script.src=LAST_UPDATE_API+'?action=lastUpdate&callback=seasonalLastUpdateCallback&_='+Date.now();script.onerror=function(){showSeasonalLastUpdate('');script.remove();};document.body.appendChild(script);}
function findCategoryColumn(head){const normalized=head.map(v=>String(v||'').trim().toLowerCase());let i=normalized.findIndex(v=>v==='category'||v==='kategori'||v==='cat');if(i<0)i=normalized.findIndex(v=>v.includes('category')||v.includes('kategori'));return i;}
function fillCategories(){categoryValues=[...new Set(rows.slice(1).map(r=>String(r[categoryIndex]??'').trim()).filter(v=>v&&v!=='-'&&v.toLowerCase()!=='category'))].sort((a,b)=>a.localeCompare(b,'id'));categoryFilter.replaceChildren();if(!categoryValues.length){categoryFilter.add(new Option('Kategori tidak ditemukan',''));categoryFilter.disabled=true;return;}categoryValues.forEach(v=>categoryFilter.add(new Option(v,v)));selectedCategory=categoryValues.includes(selectedCategory)?selectedCategory:categoryValues[0];categoryFilter.value=selectedCategory;categoryFilter.disabled=false;}
function isEmptyStock(v){const s=String(v??'').trim().toLowerCase();return s===''||s==='-'||s==='—'||s==='–';}
function stockNumber(v){let s=String(v??'').trim().replace(/\\s/g,'');if(!s||s==='-'||s==='—'||s==='–')return 0;s=s.replace(/[^0-9,.-]/g,'');if(s.includes(',')&&s.includes('.')){if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\\./g,'').replace(',','.');else s=s.replace(/,/g,'');}else if(s.includes(',')){const p=s.split(',');s=p[p.length-1].length<=2?p.slice(0,-1).join('')+'.'+p[p.length-1]:p.join('');}else if(s.includes('.')){const p=s.split('.');s=p[p.length-1].length<=2?p.slice(0,-1).join('')+'.'+p[p.length-1]:p.join('');}const n=Number(s);return Number.isFinite(n)?n:0;}
function getStockQtyIndexes(){return headers.map((h,i)=>({h:String(h??'').trim().toLowerCase(),i})).filter(x=>x.h.includes('stock')&&x.h.includes('qty')).map(x=>x.i);}
function isNumericHistoryValue(v){const s=String(v??'').trim().replace(/[\\s\\u00a0]/g,'').replace(/[^0-9,.-]/g,'');return /[0-9]/.test(s)&&/^[+-]?[0-9.,]+$/.test(s);}
function hasHistoryNumber(row){for(let i=12;i<headers.length;i++){if(isNumericHistoryValue(row[i]))return true;}return false;}
function headerIndex(keys){const normalized=headers.map(h=>String(h??'').toLowerCase().replace(/[^a-z0-9]/g,''));for(const key of keys){const i=normalized.findIndex(v=>v===key);if(i>=0)return i;}for(const key of keys){const i=normalized.findIndex(v=>v.includes(key));if(i>=0)return i;}return -1;}
function productCodeIndex(){return headerIndex(['prodcd','productcode','prodcode','kodeartikel','artikelcode','itemcode']);}
function productNameIndex(){return headerIndex(['prodnm','prodname','productname','namaartikel','namaproduk']);}
function displayIndex(){return headerIndex(['display','fotodisplay']);}
function visibleColumnIndexes(categoryRows){const cols=headers.map((head,i)=>({head:String(head??'').trim().toLowerCase(),i})).filter(x=>{const h=x.head;if(!h)return false;if(h==='cat'||h==='category'||h==='kategori'||h==='pur dd'||h==='pur xd'||/^pur\\s*(dd|xd)(\\s|$)/.test(h))return false;if(h.includes('stock'))return categoryRows.some(r=>!isEmptyStock(r[x.i])&&stockNumber(r[x.i])>0);return true;}).map(x=>x.i);const di=displayIndex();if(di<0)cols.push(-1);return cols;}
function salesAmountPeriodLabel(header){const s=String(header??'').trim();const m=s.match(/^sales\s*amount\s+(.+)$/i);return m?m[1].trim():'';}
function isSalesAmountMergePeriod(header){const p=salesAmountPeriodLabel(header).toLowerCase().replace(/\s+/g,' ');return /^(des|dec)\s+2025$/.test(p)||/^(jan|januari)\s+2026$/.test(p)||/^(feb|februari)\s+2026$/.test(p)||/^(mar|maret)\s+2026$/.test(p);}
function sessionToken(){try{const raw=localStorage.getItem('inv_sess_v1');if(!raw)return '';const session=JSON.parse(decodeURIComponent(escape(atob(raw))));return session&&session.exp>Date.now()?String(session.t||''):''}catch(e){return '';}}
async function loadSeasonalPhotos(force){const token=sessionToken();if(!token)throw new Error('Sesi login tidak ditemukan. Silakan login kembali.');const response=await fetch('/api/seasonal-photos'+(force?'?refresh='+Date.now():''),{headers:{Authorization:'Bearer '+token},cache:'no-store'});const data=await response.json();if(!response.ok||!data.success)throw new Error(data.message||'Gagal mengambil foto Seasonal.');seasonalPhotos=data.photos||{};$('photo-status').textContent='Google Drive terhubung · Folder DSH_SEASONAL_DISPLAY';return seasonalPhotos;}
function compressSeasonalPhoto(file){return new Promise((resolve,reject)=>{if(!file||!/^image\/(jpeg|png|webp)$/i.test(file.type)){reject(new Error('Pilih foto JPG, PNG, atau WEBP.'));return;}const reader=new FileReader();reader.onerror=()=>reject(new Error('Foto tidak dapat dibaca.'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('Format foto tidak dapat dibuka.'));img.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const dataUrl=canvas.toDataURL('image/jpeg',0.82);resolve({mimeType:'image/jpeg',imageBase64:dataUrl.split(',')[1]});};img.src=reader.result;};reader.readAsDataURL(file);});}
async function uploadSeasonalPhoto(file,code){const token=sessionToken();if(!token)throw new Error('Sesi login tidak ditemukan. Silakan login kembali.');const compressed=await compressSeasonalPhoto(file);const response=await fetch('/api/seasonal-photos',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({productCode:code,...compressed})});const data=await response.json();if(!response.ok||!data.success)throw new Error(data.message||'Upload foto gagal.');seasonalPhotos[code]=data.photo;}
async function deleteSeasonalPhoto(code){const token=sessionToken();if(!token)throw new Error('Sesi login tidak ditemukan. Silakan login kembali.');const response=await fetch('/api/seasonal-photos',{method:'DELETE',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({productCode:code})});const data=await response.json();if(!response.ok||!data.success)throw new Error(data.message||'Hapus foto gagal.');delete seasonalPhotos[code];}
function showSeasonalPhotoPicker(){const overlay=document.createElement('div');overlay.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(10,18,32,.62);display:flex;align-items:center;justify-content:center;padding:20px';overlay.innerHTML='<div role="dialog" aria-modal="true" style="width:min(100%,360px);background:#fff;border-radius:18px;padding:22px;box-shadow:0 18px 55px rgba(0,0,0,.28);font-family:inherit"><div style="font-size:18px;font-weight:800;color:#172033;margin-bottom:6px">Pilih Sumber Foto</div><div style="font-size:13px;color:#64748b;margin-bottom:18px">Ambil foto langsung atau pilih dari galeri.</div><div style="display:flex;gap:10px"><button type="button" data-photo-source="camera" style="flex:1;border:0;border-radius:12px;padding:14px 8px;background:#0f766e;color:white;font-weight:700">📷 Kamera</button><button type="button" data-photo-source="gallery" style="flex:1;border:0;border-radius:12px;padding:14px 8px;background:#e8eef5;color:#172033;font-weight:700">🖼️ Galeri</button></div><button type="button" data-photo-cancel style="width:100%;margin-top:12px;border:0;background:transparent;padding:9px;color:#64748b;font-weight:600">Batal</button></div>';document.body.appendChild(overlay);overlay.addEventListener('click',ev=>{if(ev.target===overlay||ev.target.closest('[data-photo-cancel]')){overlay.remove();return;}const choice=ev.target.closest('[data-photo-source]');if(!choice)return;const picker=$('seasonalPhoto'+(choice.getAttribute('data-photo-source')==='camera'?'Camera':'Gallery'));overlay.remove();picker.value='';picker.click();});}
function renderDisplayCell(row){const codeIndex=productCodeIndex(),code=codeIndex>=0?String(row[codeIndex]??'').trim():'';if(!code)return '<td class="display-cell">Kode artikel tidak ditemukan</td>';const photo=seasonalPhotos[code];if(photo&&photo.viewUrl)return '<td class="display-cell"><a href="'+esc(photo.viewUrl)+'" target="_blank" rel="noopener"><img class="display-thumb" src="'+esc(photo.thumbnailUrl||photo.viewUrl)+'" alt="Foto Display" loading="lazy"></a><div class="display-actions"><button class="btn-mini seasonal-photo-action" data-product-code="'+esc(code)+'" type="button">Foto Ulang</button><button class="btn-mini danger seasonal-photo-delete" data-product-code="'+esc(code)+'" type="button">Hapus</button></div></td>';return '<td class="display-cell"><button class="btn-mini seasonal-photo-action" data-product-code="'+esc(code)+'" type="button">＋ Input Foto</button></td>';}
function render(){if(!selectedCategory){tableWrap.innerHTML='<div class="state">Pilih kategori Seasonal untuk menampilkan artikel.</div>';return;}const q=searchEl.value.trim().toLocaleLowerCase('id');const categoryRows=rows.slice(1).map((r,i)=>({r,i})).filter(x=>String(x.r[categoryIndex]??'').trim()===selectedCategory);const stockedRows=categoryRows.filter(x=>hasHistoryNumber(x.r));
const photoDone=stockedRows.filter(x=>{const code=String(x.r[productCodeIndex()]??'').trim();return !!(seasonalPhotos[code]&&seasonalPhotos[code].viewUrl);});
const photoPending=stockedRows.length-photoDone.length;
$('stat-photo-done').textContent=fmt.format(photoDone.length);
$('stat-photo-pending').textContent=fmt.format(photoPending);
$('filter-photo-done').classList.toggle('active',photoFilter==='done');
$('filter-photo-pending').classList.toggle('active',photoFilter==='pending');
$('filter-photo-done').setAttribute('aria-pressed',String(photoFilter==='done'));
$('filter-photo-pending').setAttribute('aria-pressed',String(photoFilter==='pending'));
const statusRows=photoFilter==='done'?photoDone:photoFilter==='pending'?stockedRows.filter(x=>{const code=String(x.r[productCodeIndex()]??'').trim();return !(seasonalPhotos[code]&&seasonalPhotos[code].viewUrl);}):stockedRows;
const filtered=statusRows.filter(x=>!q||x.r.some(v=>String(v??'').toLocaleLowerCase('id').includes(q)));
