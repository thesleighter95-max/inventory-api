<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Seasonal</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:22px;font-family:Arial,sans-serif;background:#f4f7fb;color:#183153}
.wrap{max-width:1100px;margin:auto}.hero{padding:26px;border-radius:18px;background:linear-gradient(135deg,#fff,#eaf2ff);border:1px solid #dce7f5}
.kicker{font-size:11px;letter-spacing:1.8px;font-weight:800;color:#4774b8}h1{margin:9px 0;color:#183b70;font-size:clamp(24px,4vw,34px)}p{color:#65758b;line-height:1.6}
.card{margin-top:16px;padding:22px;background:#fff;border:1px solid #e1e8f0;border-radius:15px}.status{display:inline-block;margin-top:8px;padding:7px 11px;border-radius:30px;background:#fff4e5;color:#a65a00;font-size:11px;font-weight:800}
</style>
</head>
<body><main class="wrap">
<section class="hero"><div class="kicker">DSH · PERFORMANCE DASHBOARD</div><h1>Seasonal Dashboard</h1><p>Menunggu Vendor DSH beraksi</p><span class="status"></span></section>
<section class="card"><h2>Seasonal Overview</h2><p></p></section>
</main></body></html>
