<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071a35">
<title>DSH Attendance</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f5fa;font-family:Arial,sans-serif;color:#14233b}
header{background:#071a35;color:white;padding:30px 22px}
.brand{color:#8dbaff;font-size:12px;letter-spacing:2px;font-weight:bold}
h1{margin:12px 0 5px;font-size:26px}
main{max-width:480px;margin:20px auto;padding:0 15px}
.card{background:white;padding:22px;border-radius:17px;box-shadow:0 5px 20px #102b5010}
label{display:block;font-size:12px;font-weight:bold;margin:15px 0 7px}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px}
button{width:100%;padding:14px;margin-top:20px;border:0;border-radius:10px;background:#1677ff;color:white;font-weight:bold}
.note{font-size:12px;color:#718096;margin-top:15px}
</style>
</head>
<body>
<header>
<div class="brand">DSH WORKFORCE SYSTEM</div>
<h1>Attendance</h1>
LOTTE Mart Wholesale Mataram
</header>
<main>
<div class="card">
<h3>Login SPG / SPM</h3>
<label>USERNAME</label>
<input type="text" placeholder="Masukkan username">
<label>PASSWORD</label>
<input type="password" placeholder="Masukkan password">
<button disabled>LOGIN</button>
<div class="note">Sistem sedang dalam tahap pemasangan.</div>
</div>
</main>
</body>
</html>
