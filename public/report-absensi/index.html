<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071a35">
<title>DSH Attendance Report</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f5fa;font-family:Arial;color:#14233b}
header{background:#071a35;color:white;padding:28px 20px}
h1{font-size:23px;margin:0 0 8px}
main{max-width:600px;margin:20px auto;padding:0 15px}
.card{background:white;padding:22px;border-radius:16px}
label{display:block;font-size:12px;font-weight:bold;margin:15px 0 7px}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px}
button{width:100%;padding:14px;margin-top:18px;border:0;border-radius:10px;background:#1677ff;color:white;font-weight:bold}
.note{font-size:12px;color:#718096;margin-top:15px}
</style>
</head>
<body>
<header>
<h1>DSH Attendance Report</h1>
Laporan Kehadiran SPG / SPM
</header>
<main>
<div class="card">
<h3>Admin Login</h3>
<label>USERNAME ADMIN</label>
<input type="text" placeholder="Username admin">
<label>PASSWORD</label>
<input type="password" placeholder="Password admin">
<button disabled>LOGIN ADMIN</button>
<div class="note">Halaman laporan sedang dalam tahap pemasangan.</div>
</div>
</main>
</body>
</html>
